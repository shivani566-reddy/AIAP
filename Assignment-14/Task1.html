<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Info Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #3a7bd5;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        nav {
            background: #29527a;
        }
        nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            justify-content: center;
        }
        nav li {
            margin: 0 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
            padding: 10px 0;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 30px;
            min-height: 300px;
            text-align: center;
            background: white;
            margin: 30px auto;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(42,87,129,0.07);
        }
        footer {
            background: #222d39;
            color: #bbb;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Info Portal</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Students</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2>Welcome to the Student Info Portal</h2>
        <p>
            Access student records, course info, and more.<br>
            Use the navigation menu above to get started.
        </p>
    </main>
    <footer>
        &copy; 2024 Student Info Portal. All rights reserved.
    </footer>
</body>
</html>
